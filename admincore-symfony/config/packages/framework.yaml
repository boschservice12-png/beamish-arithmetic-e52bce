# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Állapotmentes alkalmazás: a bejelentkezést a Supabase kezeli a böngészőben.
    session: false

    assets:
        version_strategy: App\Asset\ContentHashVersionStrategy

when@test:
    framework:
        test: true
        http_client:
            mock_response_factory: App\Tests\Support\FakeSupabase
