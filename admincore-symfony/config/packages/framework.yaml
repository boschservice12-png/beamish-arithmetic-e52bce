# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Állapotmentes alkalmazás: a bejelentkezést a Supabase kezeli a böngészőben.
    session: false

    assets:
        version_strategy: App\Asset\ContentHashVersionStrategy

    # Ha a tárhely proxy/Cloudflare mögött van: a valódi kliens-IP kell a PIN-fékhez és a naplóhoz.
    trusted_proxies: '%env(default::TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-host', 'x-forwarded-port']

when@test:
    framework:
        test: true
        http_client:
            mock_response_factory: App\Tests\Support\FakeSupabase
