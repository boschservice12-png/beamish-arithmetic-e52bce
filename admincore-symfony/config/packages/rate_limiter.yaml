framework:
    rate_limiter:
        # Szerelő-telefon / Teendőim PIN-belépés: 4 jegyű PIN = 10 000 kombináció, ezért korlátozunk.
        # Csak a HIBÁS próbálkozás számít; sikeres belépés nullázza a dolgozó számlálóját.
        pin_login_employee:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        pin_login_ip:
            policy: sliding_window
            limit: 30
            interval: '15 minutes'
