# RedAssistance AdminCore — éles stack
# Indítás:  docker compose --env-file .env.prod up -d
name: redassistance

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/boschservice12-png/redassistance-admincore}:${APP_TAG:-latest}
    build:
      context: .
      args:
        APP_VERSION: ${APP_TAG:-dev}
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.prod}
    environment:
      APP_ENV: prod
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      # Auditnapló: tartós, a konténer cseréje után is megmarad (400 napos megőrzés)
      - audit-logs:/app/var/log
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        tag: "redassistance-app"

  # Flotta-riport ütemező (opcionális): óránként megnézi, esedékes-e a havi riport; a küldési napló miatt
  # egy időszakot pontosan egyszer küld, és ha a szerver a küldés napján állt, a következő órában pótolja.
  # Bekapcsolás:  docker compose --profile fleet-report --env-file .env.prod up -d
  # Két riport: belső (FLEET_REPORT_TO) és B2B a szerviz arculatával (FLEET_REPORT_CLIENT_TO; üresen kimarad).
  # Bemenet: a fleet-report kötet in/ mappája (FLEET_REPORT_INPUT), napló: ledger.json ugyanott.
  fleet-report:
    image: ${APP_IMAGE:-ghcr.io/boschservice12-png/redassistance-admincore}:${APP_TAG:-latest}
    profiles: [fleet-report]
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.prod}
    environment:
      APP_ENV: prod
      TZ: Europe/Bucharest
    entrypoint: ["sh", "-c", "while :; do for v in internal client; do php bin/console app:fleet-report:send --variant=$$v --if-due --no-interaction || echo \"fleet-report $$v: hiba, a következő órában újra\"; done; sleep 3600; done"]
    healthcheck:
      disable: true
    volumes:
      - audit-logs:/app/var/log
      - fleet-report:/app/var/share/fleet-report
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "redassistance-fleet-report"

volumes:
  audit-logs:
  fleet-report:
