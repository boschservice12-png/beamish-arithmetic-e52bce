# RedAssistance — monitoring + központi naplózás + riasztás
# Indítás az éles stack MELLÉ (ugyanaz a projekt és hálózat):
#   docker compose -f compose.yml -f compose.monitoring.yml --env-file .env.prod up -d
# Grafana: csak a szerveren, 127.0.0.1:3000 (SSH-alagút: ssh -L 3000:localhost:3000 szerver)
# Titkok: ops/secrets/ (lásd ops/secrets/README.md)

x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  app:
    environment:
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
    secrets: [metrics_token]

  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
    volumes:
      - ./ops/monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    secrets: [metrics_token]
    depends_on: [app]

  alertmanager:
    <<: *hardening
    image: prom/alertmanager:v0.28.1
    # a ${…} helyőrzőket indításkor a környezetből töltjük ki (az Alertmanager maga nem ismeri)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed -e "s|\$${SMTP_SMARTHOST}|$$SMTP_SMARTHOST|g" -e "s|\$${ALERT_EMAIL_FROM}|$$ALERT_EMAIL_FROM|g"
        -e "s|\$${SMTP_USER}|$$SMTP_USER|g" -e "s|\$${ALERT_EMAIL_TO}|$$ALERT_EMAIL_TO|g"
        /etc/alertmanager/alertmanager.yml > /alertmanager/runtime.yml &&
        exec /bin/alertmanager --config.file=/alertmanager/runtime.yml --storage.path=/alertmanager
    environment:
      SMTP_SMARTHOST: ${SMTP_SMARTHOST:-smtp.example.ro:587}
      SMTP_USER: ${SMTP_USER:-riasztas@example.ro}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-riasztas@example.ro}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-iroda@example.ro}
    volumes:
      - ./ops/monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    secrets: [smtp_password]

  blackbox:
    <<: *hardening
    image: prom/blackbox-exporter:v0.27.0
    command: [--config.file=/etc/blackbox/blackbox.yml]
    volumes:
      - ./ops/monitoring/blackbox:/etc/blackbox:ro

  node-exporter:
    <<: *hardening
    image: prom/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    pid: host
    volumes:
      - /:/host:ro,rslave
      - backup-metrics:/textfile:ro

  loki:
    <<: *hardening
    image: grafana/loki:3.5.3
    command: [-config.file=/etc/loki/loki.yml]
    volumes:
      - ./ops/monitoring/loki:/etc/loki:ro
      - loki-data:/loki

  alloy:
    <<: *hardening
    image: grafana/alloy:v1.10.1
    command: [run, --server.http.listen-addr=0.0.0.0:12345, --storage.path=/var/lib/alloy, /etc/alloy/config.alloy]
    volumes:
      - ./ops/monitoring/alloy:/etc/alloy:ro
      - alloy-data:/var/lib/alloy
      - audit-logs:/audit:ro
      # konténernaplók olvasása (csak olvasásra csatolva)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  grafana:
    <<: *hardening
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/redassistance.json
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./ops/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    secrets: [grafana_admin_password]
    depends_on: [prometheus, loki]

secrets:
  metrics_token:
    file: ./ops/secrets/metrics_token
  smtp_password:
    file: ./ops/secrets/smtp_password
  grafana_admin_password:
    file: ./ops/secrets/grafana_admin_password

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  alloy-data:
  grafana-data:
  backup-metrics:
