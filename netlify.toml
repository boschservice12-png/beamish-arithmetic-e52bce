[build]
  functions = "functions"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# A Symfony-alkalmazás forrása PHP-tárhelyre való, a Netlify ne szolgálja ki statikus fájlként.
[[redirects]]
  from = "/admincore-symfony/*"
  to = "/404.html"
  status = 404
  force = true

# boschteam főoldala a szerelő app; a régi RPW panel (index.html) külön alkalmazás.
[[redirects]]
  from = "/"
  to = "/szerelo-telefon.html"
  status = 200
  force = true

# A teljes RPW-csomag zipje ne legyen letölthető a site-ról.
[[redirects]]
  from = "/RPWDEPLOYteljes*"
  to = "/404.html"
  status = 404
  force = true
